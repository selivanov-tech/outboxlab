name: outboxlab

networks:
  default:
    name: outboxlab

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outboxlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outboxlab}
      POSTGRES_DB: ${POSTGRES_DB:-outboxlab}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d runs *.sql on an empty data dir only.
      # `make clean` wipes pgdata so this re-runs on next `make up`.
      - ../postgres/bootstrap_app_role.sql:/docker-entrypoint-initdb.d/01-bootstrap-app-role.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-outboxlab} -d ${POSTGRES_DB:-outboxlab}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:55432:5432"

  api:
    build:
      context: ../..
      dockerfile: infra/dev/api/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      APP_ENV: local
    volumes:
      - ../../apps/api:/app
      - ../../contracts:/contracts:ro
      # /opt/venv is baked into the image (see infra/dev/api/Dockerfile); no
      # volume mount is needed. Rebuild the image (`make rebuild`) when deps
      # change in pyproject.toml or uv.lock.
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

  worker:
    build:
      context: ../..
      dockerfile: infra/dev/api/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      APP_ENV: local
      WORKER_METRICS_PORT: "9091"
    expose:
      - "9091"
    # Shares the api image + source; runs the worker entrypoint instead of the API.
    command:
      ["sh", "-c", "uv sync && exec uv run python -m app.entrypoints.worker"]
    volumes:
      - ../../apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy

  sender-go:
    image: golang:1.26.2-alpine
    profiles: ["go-sender"]
    restart: unless-stopped
    working_dir: /src/apps/sender-go
    command: ["go", "run", "./cmd/sender"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-outboxlab}:${POSTGRES_PASSWORD:-outboxlab}@postgres:5432/${POSTGRES_DB:-outboxlab}
      MAILBOX_WORKSPACE_ID: ${MAILBOX_WORKSPACE_ID:-}
      API_INTERNAL_URL: http://api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      GOFLAGS: -buildvcs=false
    volumes:
      - ../../apps/sender-go:/src/apps/sender-go
      # The claim contract test reads contracts/ next to apps/, as in the repository.
      - ../../contracts:/src/contracts:ro
      - go-mod-cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/dev/web/Dockerfile
    restart: unless-stopped
    environment:
      OUTBOXLAB_API_URL: http://api:8000
    volumes:
      # Only the source is mounted; node_modules and config live in the image
      # (see infra/dev/web/Dockerfile).
      - ../../apps/web/src:/app/src
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  proxy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN must be set in .env}
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN must be set in .env}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./proxy/certs:/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata:
  go-mod-cache:
