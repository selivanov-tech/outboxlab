name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: api — unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: outboxlab
          POSTGRES_PASSWORD: outboxlab
          POSTGRES_DB: outboxlab
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://outboxlab:outboxlab@localhost:55432/outboxlab
      APP_ENV: ci
      # Settings requires api_domain; CI never serves traffic, so a placeholder is fine.
      API_DOMAIN: localhost
      MAILBOX_WORKSPACE_ID: 019e5f2a-1a6d-7fa2-8bee-55d3e1ccdc3d
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.17"

      - name: Sync deps
        run: uv sync --frozen

      # Role + GRANTs live outside the migration so prod (Neon) can use
      # its pre-configured app role without giving the migration role
      # CREATEROLE. In CI we run the same SQL via psql here.
      - name: Bootstrap app role
        env:
          PGPASSWORD: outboxlab
        working-directory: ${{ github.workspace }}
        run: psql -h localhost -p 55432 -U outboxlab -d outboxlab -f infra/postgres/bootstrap_app_role.sql

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Seed default workspace + mailbox
        run: uv run python -m app.entrypoints.seed

      - name: Run tests
        run: uv run pytest -q

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/sender-go/go.mod
          cache-dependency-path: apps/sender-go/go.sum

      - name: Go claim test against the migrated database
        working-directory: apps/sender-go
        env:
          TEST_DATABASE_URL: postgres://outboxlab:outboxlab@localhost:55432/outboxlab
        run: go test -count=1 -run TestClaimIntegration ./internal/queue/

  typecheck:
    name: api — pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.17"

      - name: Sync api deps
        working-directory: apps/api
        run: uv sync --frozen

      - name: Pyright api
        working-directory: apps/api
        run: uv run pyright

  lint:
    name: api — ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.17"

      - name: Sync api deps
        working-directory: apps/api
        run: uv sync --frozen

      - name: Ruff api
        working-directory: apps/api
        run: |
          uv run ruff format --check app tests
          uv run ruff check app tests

  sender-go:
    name: sender-go — vet + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sender-go
    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/sender-go/go.mod
          cache-dependency-path: apps/sender-go/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  leak-check:
    name: tracked-files hostname leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make -f infra/make/deploy.mk check-leaks

  deploy-api:
    name: deploy api to fly.io
    needs: [api-tests, typecheck, lint, sender-go, leak-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: make -f infra/make/deploy.mk deploy FLY=flyctl FLY_DEPLOY_FLAGS=--remote-only
